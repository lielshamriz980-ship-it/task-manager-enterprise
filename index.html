<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>TaskManager Enterprise</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#818cf8;--accent:#a78bfa;--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#16213e;--surface3:#1e1e35;--border:#2a2a4a;--text:#e2e8f0;--text-muted:#94a3b8;--text-dim:#64748b;--success:#10b981;--danger:#f43f5e;--warning:#f59e0b;--shadow:0 4px 24px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Heebo',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);direction:rtl;overflow-x:hidden}

/* NAV */
nav{background:rgba(26,26,46,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:.6rem}
.nav-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.nav-title{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#navUser{display:flex;align-items:center;gap:.6rem}
#navAvatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--primary);object-fit:cover;flex-shrink:0}
.nav-user-name{font-size:.85rem;color:var(--text-muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btnSignOut{background:rgba(244,63,94,.15);color:#f43f5e;border:1px solid rgba(244,63,94,.3);padding:.35rem .85rem;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.8rem;font-weight:600;transition:all .2s;white-space:nowrap}
#btnSignOut:hover{background:rgba(244,63,94,.25)}

/* AUTH SCREEN */
#screenAuth{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px);padding:1.5rem;background:radial-gradient(ellipse at top,rgba(99,102,241,.15) 0%,transparent 60%)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:3rem 2.5rem;text-align:center;width:100%;max-width:420px;box-shadow:var(--shadow),0 0 80px rgba(99,102,241,.1)}
.auth-glow{width:80px;height:80px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 1.5rem;box-shadow:0 0 40px rgba(99,102,241,.4)}
.auth-card h2{font-size:2rem;font-weight:900;color:#fff;margin-bottom:.5rem;letter-spacing:-.03em}
.auth-card p{color:var(--text-muted);margin-bottom:2.5rem;font-size:.95rem;line-height:1.6}
.auth-divider{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;color:var(--text-dim);font-size:.8rem}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
#btnSignIn{display:flex;align-items:center;justify-content:center;gap:.75rem;background:#fff;border:none;color:#374151;padding:1rem 2rem;border-radius:14px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;width:100%;transition:all .2s;box-shadow:0 2px 12px rgba(0,0,0,.2)}
#btnSignIn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
#btnSignIn:active{transform:translateY(0)}

/* APP SCREEN */
#screenApp{padding:1.5rem;max-width:860px;margin:0 auto;display:none}

/* WORKSPACE BADGE */
.ws-badge{background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(167,139,250,.2));border:1px solid rgba(99,102,241,.3);border-radius:14px;padding:.75rem 1.25rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:.6rem;font-size:.85rem;font-weight:600;color:var(--primary-light)}
.ws-dot{width:8px;height:8px;background:#10b981;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.1rem .75rem;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.stat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--primary-dark),var(--accent));opacity:0;transition:opacity .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-num{font-size:1.9rem;font-weight:900;color:var(--primary-light);line-height:1;position:relative}
.stat-label{font-size:.72rem;color:var(--text-dim);margin-top:.35rem;font-weight:500;position:relative}

/* ADD TASK */
.add-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.25rem;margin-bottom:1.5rem;display:flex;gap:.75rem;align-items:center}
#taskInput{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:.8rem 1rem;font-family:inherit;font-size:.95rem;color:var(--text);outline:none;transition:border-color .2s;min-width:0}
#taskInput::placeholder{color:var(--text-dim)}
#taskInput:focus{border-color:var(--primary)}
#btnAdd{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;border-radius:12px;padding:.8rem 1.25rem;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;box-shadow:0 4px 15px rgba(99,102,241,.4)}
#btnAdd:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.5)}
#btnAdd:active{transform:translateY(0)}

/* TASKS */
.tasks-header{font-size:.8rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.75rem}
#taskList{display:flex;flex-direction:column;gap:.6rem}

.task-item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:.9rem 1.1rem;display:flex;align-items:center;gap:.85rem;transition:all .25s;position:relative;overflow:hidden}
.task-item::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--primary),var(--accent));opacity:0;transition:opacity .2s}
.task-item:hover{border-color:rgba(99,102,241,.4);transform:translateX(-3px)}
.task-item:hover::before{opacity:1}
.task-item.done{opacity:.6}
.task-item.done .task-text{text-decoration:line-through;color:var(--text-dim)}
.task-item.done::before{background:linear-gradient(var(--success),#059669);opacity:1}

.task-check{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:transparent}
.task-check:hover{border-color:var(--primary);background:rgba(99,102,241,.1)}
.task-check.checked{background:linear-gradient(135deg,var(--success),#059669);border-color:var(--success);box-shadow:0 2px 8px rgba(16,185,129,.4)}
.task-check.checked::after{content:'✓';color:#fff;font-size:.85rem;font-weight:800}

.task-text{flex:1;font-size:.92rem;color:var(--text);line-height:1.4;word-break:break-word}

.task-avatar-wrap{position:relative;flex-shrink:0}
.task-avatar{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);object-fit:cover;display:block}
.task-avatar-fallback{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--primary-dark),var(--accent));display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#fff;font-weight:700;flex-shrink:0}
.task-tooltip{position:absolute;bottom:calc(100% + 6px);right:50%;transform:translateX(50%);background:#1e293b;color:#fff;font-size:.72rem;padding:.3rem .6rem;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;border:1px solid var(--border);z-index:10}
.task-tooltip::after{content:'';position:absolute;top:100%;right:50%;transform:translateX(50%);border:4px solid transparent;border-top-color:#1e293b}
.task-avatar-wrap:hover .task-tooltip{opacity:1}

.task-del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:1rem;opacity:0;transition:opacity .2s;padding:.25rem;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.task-item:hover .task-del{opacity:.7}
.task-del:hover{opacity:1 !important;background:rgba(244,63,94,.15)}

.empty-state{text-align:center;padding:4rem 1.5rem;color:var(--text-dim)}
.empty-icon{width:72px;height:72px;background:var(--surface2);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1.25rem;border:1px solid var(--border)}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--text-muted);margin-bottom:.4rem}
.empty-state p{font-size:.85rem}

/* TOAST */
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:.7rem 1.4rem;border-radius:12px;font-size:.875rem;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;border:1px solid var(--border);box-shadow:var(--shadow);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ANIMATIONS */
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.task-item{animation:slideIn .2s ease}

/* RESPONSIVE MOBILE */
@media(max-width:600px){
  nav{padding:.75rem 1rem}
  .nav-user-name{display:none}
  #screenApp{padding:1rem}
  .stats-bar{gap:.5rem}
  .stat-card{padding:.85rem .5rem;border-radius:12px}
  .stat-num{font-size:1.5rem}
  .stat-label{font-size:.68rem}
  .add-box{padding:1rem;border-radius:14px;gap:.6rem}
  #taskInput{padding:.75rem .85rem;font-size:.9rem}
  #btnAdd{padding:.75rem 1rem;font-size:.85rem}
  .task-item{padding:.8rem .9rem;border-radius:12px;gap:.7rem}
  .task-text{font-size:.88rem}
  .auth-card{padding:2rem 1.5rem;border-radius:20px}
  .auth-card h2{font-size:1.6rem}
  .task-del{opacity:.5}
  .ws-badge{font-size:.8rem;padding:.65rem 1rem}
}
@media(max-width:380px){
  .stat-num{font-size:1.3rem}
  .add-box{flex-wrap:wrap}
  #taskInput{width:100%}
  #btnAdd{width:100%;justify-content:center;display:flex}
}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="nav-logo">📋</div>
    <span class="nav-title">TaskManager</span>
  </div>
  <div id="navUser" style="display:none">
    <img id="navAvatar" src="" alt="">
    <span class="nav-user-name" id="navName"></span>
    <button id="btnSignOut">התנתק</button>
  </div>
</nav>

<div id="screenAuth">
  <div class="auth-card">
    <div class="auth-glow">📋</div>
    <h2>ברוך הבא</h2>
    <p>נהל משימות עם הצוות שלך<br>בזמן אמת מכל מקום</p>
    <div class="auth-divider">כניסה מאובטחת</div>
    <button id="btnSignIn">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      המשך עם Google
    </button>
  </div>
</div>

<div id="screenApp">
  <div class="ws-badge">
    <div class="ws-dot"></div>
    Workspace משותף — כל חברי הצוות רואים את אותן המשימות
  </div>
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">סה״כ</div></div>
    <div class="stat-card"><div class="stat-num" id="statDone" style="color:#10b981">0</div><div class="stat-label">הושלמו</div></div>
    <div class="stat-card"><div class="stat-num" id="statPending" style="color:#f59e0b">0</div><div class="stat-label">ממתינות</div></div>
  </div>
  <div class="add-box">
    <input id="taskInput" placeholder="הוסף משימה חדשה לצוות..." autocomplete="off">
    <button id="btnAdd">+ הוסף</button>
  </div>
  <div class="tasks-header">משימות הצוות</div>
  <div id="taskList"></div>
</div>

<div id="toast"></div>

<script>(async()=>{
const{initializeApp}=await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
const{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
const{getFirestore,collection,addDoc,deleteDoc,doc,updateDoc,onSnapshot}=await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
const cfg={apiKey:'AIzaSyBSsizUt53bkQD_Osc3oeSvvW-EJG96ZEo',authDomain:'taskmanager-enterprise.firebaseapp.com',projectId:'taskmanager-enterprise',storageBucket:'taskmanager-enterprise.firebasestorage.app',messagingSenderId:'355996684261',appId:'1:355996684261:web:0286eaa61473af6b90290c'};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);let unsub=null;
const $=id=>document.getElementById(id);
const toast=msg=>{const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)};
const stats=tasks=>{const d=tasks.filter(t=>t.done).length;$('statTotal').textContent=tasks.length;$('statDone').textContent=d;$('statPending').textContent=tasks.length-d};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const render=(tasks,currentUid)=>{
const sorted=[...tasks].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
const L=$('taskList');stats(sorted);
if(!sorted.length){L.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><h3>אין משימות עדיין</h3><p>הוסף את המשימה הראשונה לצוות</p></div>';return}
L.innerHTML=sorted.map(t=>{
const canDel=t.uid===currentUid;
const avatar=t.userPhoto
?'<div class="task-avatar-wrap"><img class="task-avatar" src="'+esc(t.userPhoto)+'" alt="" title="'+esc(t.userName||'')+'"><span class="task-tooltip">'+esc(t.userName||'משתמש')+'</span></div>'
:'<div class="task-avatar-fallback" title="'+esc(t.userName||'')+'">'+esc((t.userName||'?')[0])+'</div>';
return '<div class="task-item'+(t.done?' done':'')+'">'
+'<div class="task-check'+(t.done?' checked':'')+'" data-id="'+t.id+'" data-done="'+(!t.done)+'"></div>'
+'<span class="task-text">'+esc(t.text)+'</span>'
+avatar
+(canDel?'<button class="task-del" data-id="'+t.id+'" title="מחק">🗑</button>':'')
+'</div>';
}).join('');
L.querySelectorAll('.task-check').forEach(e=>e.onclick=()=>updateDoc(doc(db,'tasks',e.dataset.id),{done:e.dataset.done==='true'}).then(()=>toast(e.dataset.done==='true'?'✅ הושלמה':'↩️ פתוחה מחדש')));
L.querySelectorAll('.task-del').forEach(e=>e.onclick=()=>{if(confirm('למחוק את המשימה?'))deleteDoc(doc(db,'tasks',e.dataset.id)).then(()=>toast('🗑 נמחקה'))});
};
onAuthStateChanged(auth,u=>{
if(u){
$('screenAuth').style.display='none';$('screenApp').style.display='block';$('navUser').style.display='flex';
$('navAvatar').src=u.photoURL||'';$('navName').textContent=u.displayName||u.email;
if(unsub)unsub();
unsub=onSnapshot(collection(db,'tasks'),s=>render(s.docs.map(d=>({id:d.id,...d.data()})),u.uid));
toast('👋 שלום '+((u.displayName||u.email).split(' ')[0])+'!');
}else{
$('screenAuth').style.display='flex';$('screenApp').style.display='none';$('navUser').style.display='none';
if(unsub){unsub();unsub=null}
}
});
$('btnSignIn').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast('שגיאה: '+e.message));
$('btnSignOut').onclick=()=>signOut(auth).then(()=>toast('👋 להתראות!'));
$('btnAdd').onclick=async()=>{const i=$('taskInput'),t=i.value.trim(),u=auth.currentUser;if(!t||!u)return;await addDoc(collection(db,'tasks'),{text:t,done:false,uid:u.uid,userName:u.displayName||u.email,userPhoto:u.photoURL||'',createdAt:Date.now()});i.value='';toast('✨ נוסף!')};
$('taskInput').onkeydown=e=>{if(e.key==='Enter')$('btnAdd').click()};
})();</script>
</body></html>
