<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>TaskManager Enterprise</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--r:14px;--r-sm:10px;--ease:.22s cubic-bezier(.4,0,.2,1);--shadow-sm:0 1px 3px rgba(0,0,0,.12);--shadow:0 4px 16px rgba(0,0,0,.12);--shadow-lg:0 20px 48px rgba(0,0,0,.18);--primary:#6366f1;--primary-h:#4f46e5;--primary-1:#818cf8;--accent:#ec4899}
[data-theme="dark"]{--bg:#0d0d1a;--surface:#1e1e35;--surface2:#252540;--surface3:#2c2c50;--border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.14);--text:#e8eaf6;--text-2:#9fa8da;--text-3:#5c6394;--nav-bg:rgba(13,13,26,.85)}
[data-theme="light"]{--bg:#f5f5fa;--surface:#ffffff;--surface2:#f0f0f8;--surface3:#e8e8f2;--border:rgba(0,0,0,.08);--border-h:rgba(0,0,0,.14);--text:#1a1a2e;--text-2:#4a4a6a;--text-3:#8888aa;--nav-bg:rgba(245,245,250,.9)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;overflow-x:hidden;transition:background var(--ease),color var(--ease)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
nav{background:var(--nav-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:.8rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.nav-logo{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff}
.nav-logo svg{width:18px;height:18px;stroke-width:2.2}
.nav-title{font-size:1rem;font-weight:800;color:var(--primary-1);letter-spacing:-.02em;white-space:nowrap}
.nav-right{display:flex;align-items:center;gap:.6rem}
.theme-btn{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:all var(--ease)}
.theme-btn:hover{border-color:var(--border-h);color:var(--text)}
.theme-btn svg{width:16px;height:16px;stroke-width:2}
#navUser{display:flex;align-items:center;gap:.6rem}
#navAvatar{width:30px;height:30px;border-radius:50%;border:2px solid var(--primary);object-fit:cover}
.nav-uname{font-size:.8rem;color:var(--text-2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-signout{height:30px;padding:0 .75rem;border-radius:var(--r-sm);border:1px solid rgba(244,63,94,.3);background:rgba(244,63,94,.1);color:#f43f5e;cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:.3rem;transition:all var(--ease)}
.nav-signout:hover{background:rgba(244,63,94,.2)}
.nav-signout svg{width:14px;height:14px;stroke-width:2.2}
#screenAuth{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 57px);padding:1.5rem;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(99,102,241,.12) 0%,transparent 70%)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:3rem 2.5rem;text-align:center;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
.auth-icon-wrap{width:72px;height:72px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;box-shadow:0 0 32px rgba(99,102,241,.35)}
.auth-icon-wrap svg{width:34px;height:34px;color:#fff;stroke-width:2}
.auth-card h2{font-size:1.9rem;font-weight:900;letter-spacing:-.04em;margin-bottom:.5rem}
.auth-card p{color:var(--text-2);font-size:.9rem;line-height:1.7;margin-bottom:2rem}
.auth-sep{display:flex;align-items:center;gap:.75rem;color:var(--text-3);font-size:.75rem;margin-bottom:1.25rem}
.auth-sep::before,.auth-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-btn{width:100%;padding:.85rem 1.5rem;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center;gap:.6rem;transition:all var(--ease)}
.auth-btn:hover{border-color:var(--border-h);background:var(--surface3);transform:translateY(-1px);box-shadow:var(--shadow)}
.auth-btn svg{width:20px;height:20px}
#screenApp{display:none;padding:1.5rem;max-width:880px;margin:0 auto}
.workspace-badge{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(236,72,153,.15));border:1px solid rgba(99,102,241,.25);border-radius:12px;padding:.6rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--text-2)}
.workspace-badge svg{width:14px;height:14px;color:var(--primary-1);stroke-width:2;flex-shrink:0}
.workspace-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;flex-shrink:0}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem;text-align:center}
.stat-num{font-size:1.6rem;font-weight:900;line-height:1}
.stat-num.total{color:var(--primary-1)}
.stat-num.done{color:#22c55e}
.stat-num.pend{color:#f59e0b}
.stat-label{font-size:.72rem;color:var(--text-3);margin-top:.2rem}
.add-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-start}
.add-input{flex:1;min-width:160px;background:none;border:none;outline:none;font-family:inherit;font-size:.95rem;color:var(--text);padding:.4rem 0}
.add-input::placeholder{color:var(--text-3)}
.add-actions{display:flex;gap:.4rem;flex-shrink:0;align-items:center}
.attach-trigger{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:all var(--ease);position:relative;flex-shrink:0}
.attach-trigger:hover{border-color:var(--border-h);color:var(--text)}
.attach-trigger svg{width:16px;height:16px;stroke-width:2}
.attach-badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.add-btn{height:34px;padding:0 1rem;border-radius:var(--r-sm);border:none;background:var(--primary);color:#fff;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:.4rem;transition:all var(--ease);white-space:nowrap}
.add-btn:hover{background:var(--primary-h);transform:translateY(-1px)}
.add-btn svg{width:16px;height:16px;stroke-width:2.5}
.pending-files{width:100%;display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.25rem}
.pending-chip{display:flex;align-items:center;gap:.3rem;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.25rem .5rem;font-size:.75rem;color:var(--text-2);max-width:180px}
.pending-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pending-chip button{background:none;border:none;cursor:pointer;color:var(--text-3);padding:0;display:flex;line-height:1;flex-shrink:0}
.pending-chip svg{width:12px;height:12px;stroke-width:2.5}
.pending-img-preview{width:36px;height:36px;object-fit:cover;border-radius:4px;flex-shrink:0}
.tasks-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.tasks-title{font-size:.82rem;font-weight:700;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.tasks-count{font-size:.75rem;color:var(--text-3);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:.15rem .6rem}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1rem;margin-bottom:.5rem;display:flex;flex-direction:column;gap:.5rem;transition:all var(--ease);position:relative}
.task-card:hover{border-color:var(--border-h);box-shadow:var(--shadow-sm)}
.task-card.done-card{opacity:.6}
.task-card.drag-over{border-color:var(--primary);background:rgba(99,102,241,.06)}
.task-top{display:flex;align-items:center;gap:.6rem}
.task-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border-h);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--ease)}
.task-check.checked{background:var(--primary);border-color:var(--primary)}
.task-check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;display:none}
.task-check.checked svg{display:block}
.task-text{flex:1;font-size:.9rem;line-height:1.5;word-break:break-word}
.task-text.striked{text-decoration:line-through;color:var(--text-3)}
.task-actions{display:flex;align-items:center;gap:.3rem;flex-shrink:0}
.task-avatar{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);object-fit:cover;cursor:default;flex-shrink:0}
.task-attach-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:all var(--ease);position:relative;flex-shrink:0}
.task-attach-btn:hover{border-color:var(--border-h);color:var(--text)}
.task-attach-btn svg{width:13px;height:13px;stroke-width:2}
.task-attach-badge{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--primary);color:#fff;font-size:.55rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.task-del{width:28px;height:28px;border-radius:6px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:all var(--ease)}
.task-del:hover{color:#f43f5e;background:rgba(244,63,94,.1)}
.task-del svg{width:14px;height:14px;stroke-width:2}
.attach-panel{overflow:hidden;max-height:0;transition:max-height .3s var(--ease);border-top:0 solid var(--border)}
.attach-panel.open{max-height:600px;border-top:1px solid var(--border);padding-top:.5rem}
.attach-drop{border:2px dashed var(--border);border-radius:8px;padding:1.5rem;text-align:center;cursor:pointer;transition:all var(--ease);color:var(--text-3);font-size:.82rem}
.attach-drop:hover,.attach-drop.dragover{border-color:var(--primary);color:var(--primary-1);background:rgba(99,102,241,.05)}
.attach-drop svg{width:24px;height:24px;stroke-width:1.5;margin-bottom:.4rem}
.attach-drop input{display:none}
.attach-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.attach-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.4rem;width:80px;cursor:pointer}
.attach-item img{width:72px;height:64px;object-fit:cover;border-radius:5px}
.attach-item-icon{width:72px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;color:var(--text-2)}
.attach-item-icon svg{width:28px;height:28px;stroke-width:1.5}
.attach-item-name{font-size:.65rem;color:var(--text-2);width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.attach-item-size{font-size:.6rem;color:var(--text-3)}
.attach-item-del{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:rgba(244,63,94,.85);border:none;cursor:pointer;display:none;align-items:center;justify-content:center}
.attach-item:hover .attach-item-del{display:flex}
.attach-item-del svg{width:10px;height:10px;stroke:#fff;stroke-width:3}
.attach-upload-row{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.upload-progress{flex:1;height:4px;border-radius:2px;background:var(--surface3);overflow:hidden;display:none}
.upload-progress.active{display:block}
.upload-progress-bar{height:100%;border-radius:2px;background:var(--primary);transition:width .3s}
.upload-status{font-size:.75rem;color:var(--text-3)}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;align-items:center;justify-content:center;padding:1rem}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain}
.lightbox-close{position:absolute;top:1rem;left:1rem;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.lightbox-close svg{width:20px;height:20px;stroke-width:2.5}
.toast{position:fixed;bottom:1.5rem;right:50%;transform:translateX(50%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.7rem 1.2rem;font-size:.85rem;box-shadow:var(--shadow-lg);z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-3)}
.empty-state svg{width:48px;height:48px;stroke-width:1.2;margin-bottom:.75rem;color:var(--text-3)}
.empty-state p{font-size:.9rem}
.size-warn{color:#f59e0b;font-size:.75rem;margin-top:.25rem;display:none}
@media(max-width:600px){
  nav{padding:.7rem 1rem}
  .nav-title{font-size:.9rem}
  .nav-uname{display:none}
  .stats-row{gap:.5rem}
  .stat-num{font-size:1.3rem}
  #screenApp{padding:1rem .75rem}
  .auth-card{padding:2rem 1.5rem}
  .auth-card h2{font-size:1.5rem}
  .add-box{padding:.6rem .75rem}
  .task-card{padding:.75rem .8rem}
}
</style>
</head>
<body data-theme="dark">
<nav>
  <div class="nav-brand">
    <div class="nav-logo"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg></div>
    <span class="nav-title">TaskManager</span>
  </div>
  <div class="nav-right">
    <button class="theme-btn" id="themeTgl" title="החלף ערכת צבעים" onclick="cycleTheme()">
      <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="5"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
    <div id="navUser" style="display:none">
      <img id="navAvatar" src="" alt="avatar">
      <span class="nav-uname" id="navUname"></span>
      <button class="nav-signout" onclick="doSignOut()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        יציאה
      </button>
    </div>
  </div>
</nav>

<div id="screenAuth">
  <div class="auth-card">
    <div class="auth-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    </div>
    <h2>TaskManager Enterprise</h2>
    <p>סביבת עבודה משותפת בזמן אמת.<br>התחבר כדי להתחיל לנהל את המשימות שלך.</p>
    <div class="auth-sep">כניסה</div>
    <button class="auth-btn" onclick="doSignIn()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.7 29.2 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 3l5.7-5.7C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.6 20-21 0-1.3-.2-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.4 18.9 12 24 12c3.1 0 5.9 1.1 8.1 3l5.7-5.7C34.5 5.1 29.6 3 24 3 16.3 3 9.6 7.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 36.3 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-8H6.1C9.4 37.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.2-2.2 4-4 5.5l6.6 5.4C42 35.1 44 30 44 24c0-1.3-.2-2.7-.4-4z"/></svg>
      התחבר עם Google
    </button>
  </div>
</div>

<div id="screenApp">
  <div class="workspace-badge">
    <div class="workspace-dot"></div>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
    <span>Workspace משותף — כל חברי הצוות רואים את אותן המשימות</span>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-num pend" id="statPend">0</div><div class="stat-label">ממתינות</div></div>
    <div class="stat-card"><div class="stat-num done" id="statDone">0</div><div class="stat-label">הושלמו</div></div>
    <div class="stat-card"><div class="stat-num total" id="statTotal">0</div><div class="stat-label">סה"כ</div></div>
  </div>

  <div class="add-box">
    <input class="add-input" id="taskInput" placeholder="הוסף משימה חדשה לצוות..." onkeydown="if(event.key==='Enter')addTask()">
    <div class="add-actions">
      <button class="attach-trigger" id="addAttachTrig" onclick="toggleAddAttach()" title="צרף קבצים">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
        <span class="attach-badge" id="addAttachBadge" style="display:none"></span>
      </button>
      <button class="add-btn" onclick="addTask()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        הוסף
      </button>
    </div>
    <div id="addPendingFiles" class="pending-files" style="display:none"></div>
    <div class="size-warn" id="sizeWarn">קובץ גדול מדי - מקסימום 800KB לקובץ</div>
  </div>

  <div class="tasks-header">
    <span class="tasks-title">משימות הצוות</span>
    <span class="tasks-count" id="tasksCount">0 משימות</span>
  </div>

  <div id="taskList"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
  <img id="lightboxImg" src="" alt="">
</div>
<div class="toast" id="toast"></div>

<script>
(async()=>{
const FIREBASE_CONFIG={apiKey:'AIzaSyBSsizUt53bkQD_Osc3oeSvvW-EJG96ZEo',authDomain:'taskmanager-enterprise.firebaseapp.com',projectId:'taskmanager-enterprise',storageBucket:'taskmanager-enterprise.appspot.com',messagingSenderId:'355996684261',appId:'1:355996684261:web:0286eaa61473af6b90290c'};
const MAX_FILE_SIZE = 800 * 1024; // 800KB max per file (Firestore doc limit is ~1MB)

// Firebase imports
const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
const {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
const {getFirestore,collection,addDoc,onSnapshot,updateDoc,deleteDoc,doc,serverTimestamp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

const app=initializeApp(FIREBASE_CONFIG);
const auth=getAuth(app);
const db=getFirestore(app);
const provider=new GoogleAuthProvider();

// Theme
let themes=['dark','light','system'];
let themeIdx=0;
function applyTheme(){
  const t=themes[themeIdx];
  const icons={
    dark:'<circle cx="12" cy="12" r="5"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>',
    light:'<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>',
    system:'<path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>'
  };
  document.getElementById('themeIcon').innerHTML=icons[t];
  if(t==='system'){
    const isDark=window.matchMedia('(prefers-color-scheme:dark)').matches;
    document.body.dataset.theme=isDark?'dark':'light';
  } else {
    document.body.dataset.theme=t;
  }
  localStorage.setItem('tm-theme',t);
  showToast(t==='dark'?'מצב כהה':'t'==='light'?'מצב בהיר':'מצב מערכת');
}
const saved=localStorage.getItem('tm-theme')||'dark';
themeIdx=themes.indexOf(saved);
if(themeIdx<0)themeIdx=0;
// Apply without toast on load
const t0=themes[themeIdx];
const icons0={dark:'<circle cx="12" cy="12" r="5"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>',light:'<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>',system:'<path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>'};
document.getElementById('themeIcon').innerHTML=icons0[t0];
if(t0==='system'){const d=window.matchMedia('(prefers-color-scheme:dark)').matches;document.body.dataset.theme=d?'dark':'light';}else{document.body.dataset.theme=t0;}
window.cycleTheme=function(){themeIdx=(themeIdx+1)%3;applyTheme();};
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(themes[themeIdx]==='system')applyTheme();});

// Toast
window.showToast=function(msg,dur=2200){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur);};

// Auth
let currentUser=null;
window.doSignIn=async function(){try{await signInWithPopup(auth,provider);}catch(e){showToast('שגיאת התחברות');}};
window.doSignOut=async function(){await signOut(auth);};
onAuthStateChanged(auth,u=>{
  currentUser=u;
  if(u){
    document.getElementById('screenAuth').style.display='none';
    document.getElementById('screenApp').style.display='block';
    document.getElementById('navUser').style.display='flex';
    document.getElementById('navAvatar').src=u.photoURL||'';
    document.getElementById('navUname').textContent=u.displayName||u.email||'';
    startTaskListener();
  } else {
    document.getElementById('screenAuth').style.display='flex';
    document.getElementById('screenApp').style.display='none';
    document.getElementById('navUser').style.display='none';
  }
});

// Pending file attachments for new task (base64)
let pendingFiles=[];
function clearPending(){pendingFiles=[];renderPending();}
function renderPending(){
  const wrap=document.getElementById('addPendingFiles');
  const badge=document.getElementById('addAttachBadge');
  if(!pendingFiles.length){wrap.style.display='none';badge.style.display='none';return;}
  wrap.style.display='flex';
  badge.style.display='flex';badge.textContent=pendingFiles.length;
  wrap.innerHTML='';
  pendingFiles.forEach((f,i)=>{
    const chip=document.createElement('div');chip.className='pending-chip';
    let preview='';
    if(f.type.startsWith('image/')&&f.data){preview=`<img class="pending-img-preview" src="${f.data}" alt="">`;}
    chip.innerHTML=`${preview}<span>${f.name}</span><button onclick="removePending(${i})"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>`;
    wrap.appendChild(chip);
  });
}
window.removePending=function(i){pendingFiles.splice(i,1);renderPending();};
window.toggleAddAttach=function(){
  const fileInput=document.createElement('input');fileInput.type='file';fileInput.multiple=true;fileInput.accept='image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt,.zip';
  fileInput.onchange=e=>handlePendingFiles(Array.from(e.target.files));
  fileInput.click();
};

function handlePendingFiles(files){
  const warn=document.getElementById('sizeWarn');
  let hasWarn=false;
  files.forEach(file=>{
    if(file.size>MAX_FILE_SIZE){hasWarn=true;return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      pendingFiles.push({name:file.name,type:file.type,size:file.size,data:ev.target.result});
      renderPending();
    };
    reader.readAsDataURL(file);
  });
  if(hasWarn){warn.style.display='block';setTimeout(()=>warn.style.display='none',3000);}
}

// Add task
window.addTask=async function(){
  if(!currentUser)return;
  const inp=document.getElementById('taskInput');
  const text=inp.value.trim();
  if(!text)return;
  const filesToAdd=[...pendingFiles];
  clearPending();
  inp.value='';
  try{
    await addDoc(collection(db,'tasks'),{
      text,
      done:false,
      uid:currentUser.uid,
      userName:currentUser.displayName||currentUser.email||'',
      userPhoto:currentUser.photoURL||'',
      attachments:filesToAdd,
      createdAt:serverTimestamp()
    });
  } catch(e){showToast('שגיאה בהוספת משימה');}
};

// Task listener
let unsubTasks=null;
function startTaskListener(){
  if(unsubTasks)unsubTasks();
  unsubTasks=onSnapshot(collection(db,'tasks'),snap=>{
    let tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    tasks.sort((a,b)=>{
      const ta=a.createdAt?.toMillis?.()||0;
      const tb=b.createdAt?.toMillis?.()||0;
      return tb-ta;
    });
    renderTasks(tasks);
  });
}

// Render tasks
function renderTasks(tasks){
  const list=document.getElementById('taskList');
  const done=tasks.filter(t=>t.done).length;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statPend').textContent=tasks.length-done;
  document.getElementById('statTotal').textContent=tasks.length;
  document.getElementById('tasksCount').textContent=tasks.length+' משימות';
  if(!tasks.length){list.innerHTML=`<div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><p>אין משימות עדיין — הוסף את הראשונה!</p></div>`;return;}
  list.innerHTML=tasks.map(task=>{
    const att=task.attachments||[];
    const cnt=att.length;
    const isOwner=currentUser&&task.uid===currentUser.uid;
    return `<div class="task-card${task.done?' done-card':''}" id="tc-${task.id}" ondragover="ev.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="handleDrop(event,'${task.id}')">
      <div class="task-top">
        <button class="task-check${task.done?' checked':''}" onclick="toggleTask('${task.id}',${!task.done})">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        </button>
        <span class="task-text${task.done?' striked':''}">${escapeHtml(task.text)}</span>
        <div class="task-actions">
          ${task.userPhoto?`<img class="task-avatar" src="${task.userPhoto}" alt="${escapeHtml(task.userName||'')}" title="${escapeHtml(task.userName||'')}" onerror="this.style.display='none'">`:''}
          <button class="task-attach-btn" onclick="toggleAttachPanel('${task.id}')" title="קבצים מצורפים">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
            ${cnt?`<span class="task-attach-badge">${cnt}</span>`:''}
          </button>
          ${isOwner?`<button class="task-del" onclick="deleteTask('${task.id}')" title="מחק משימה"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>`:''}
        </div>
      </div>
      <div class="attach-panel${cnt?' open':''}" id="ap-${task.id}">
        ${cnt?`<div class="attach-grid">${att.map((a,ai)=>`<div class="attach-item" onclick="clickAttach('${task.id}',${ai})">${a.type&&a.type.startsWith('image/')&&a.data?`<img src="${a.data}" alt="${escapeHtml(a.name)}">`:`<div class="attach-item-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span style="font-size:.65rem;color:var(--text-3)">${(a.size/1024).toFixed(0)}KB</span></div>`}<div class="attach-item-name">${escapeHtml(a.name)}</div>${isOwner?`<button class="attach-item-del" onclick="event.stopPropagation();delAttachment('${task.id}',${ai})"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>`:''}
        </div>`).join('')}</div>`:''}
        <label class="attach-drop" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event,'${task.id}');this.classList.remove('dragover')">
          <input type="file" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt,.zip" onchange="addAttachmentsToTask('${task.id}',Array.from(this.files))">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <div>גרור קבצים לכאן או לחץ לבחירה</div>
          <div style="font-size:.7rem;margin-top:.2rem">מקסימום 800KB לקובץ</div>
        </label>
        <div class="upload-progress" id="up-${task.id}"><div class="upload-progress-bar" id="upb-${task.id}" style="width:0%"></div></div>
        <div class="upload-status" id="us-${task.id}"></div>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// Toggle task done
window.toggleTask=async function(id,done){
  try{await updateDoc(doc(db,'tasks',id),{done});}catch(e){showToast('שגיאה');}
};

// Delete task
window.deleteTask=async function(id){
  try{await deleteDoc(doc(db,'tasks',id));showToast('משימה נמחקה');}catch(e){showToast('שגיאה במחיקה');}
};

// Toggle attach panel
window.toggleAttachPanel=function(id){
  const panel=document.getElementById('ap-'+id);
  if(panel)panel.classList.toggle('open');
};

// Add attachments to existing task (base64)
window.addAttachmentsToTask=async function(taskId,files){
  if(!currentUser)return;
  const warn=document.getElementById('sizeWarn');
  const progressBar=document.getElementById('upb-'+taskId);
  const progressWrap=document.getElementById('up-'+taskId);
  const statusEl=document.getElementById('us-'+taskId);
  
  const validFiles=files.filter(f=>{
    if(f.size>MAX_FILE_SIZE){showToast('קובץ גדול מדי: '+f.name+' (מקסימום 800KB)');return false;}
    return true;
  });
  if(!validFiles.length)return;
  
  progressWrap.classList.add('active');
  statusEl.textContent='מעלה...';
  
  const newAttachments=await Promise.all(validFiles.map((file,i)=>new Promise(resolve=>{
    const reader=new FileReader();
    reader.onprogress=e=>{if(e.lengthComputable){const pct=Math.round(((i/validFiles.length)+(e.loaded/e.total/validFiles.length))*100);if(progressBar)progressBar.style.width=pct+'%';}};
    reader.onload=ev=>{resolve({name:file.name,type:file.type,size:file.size,data:ev.target.result,uploadedBy:currentUser.uid,uploadedAt:Date.now()});};
    reader.readAsDataURL(file);
  })));
  
  if(progressBar)progressBar.style.width='90%';
  
  // Get current task attachments
  const {getDoc}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const taskDoc=await getDoc(doc(db,'tasks',taskId));
  if(!taskDoc.exists()){statusEl.textContent='שגיאה';return;}
  const existing=taskDoc.data().attachments||[];
  const combined=[...existing,...newAttachments];
  
  await updateDoc(doc(db,'tasks',taskId),{attachments:combined});
  if(progressBar)progressBar.style.width='100%';
  statusEl.textContent='הועלה בהצלחה!';
  setTimeout(()=>{progressWrap.classList.remove('active');statusEl.textContent='';if(progressBar)progressBar.style.width='0%';},1500);
  showToast(newAttachments.length+' קבצים נוספו');
};

// Drag drop on task card
window.handleDrop=function(event,taskId){
  event.preventDefault();
  const card=document.getElementById('tc-'+taskId);
  if(card)card.classList.remove('drag-over');
  const files=Array.from(event.dataTransfer.files);
  if(files.length)addAttachmentsToTask(taskId,files);
};

// Click attachment
window.clickAttach=function(taskId,idx){
  // Find task in current snapshot — just open image lightbox or download
  const panel=document.getElementById('ap-'+taskId);
  const items=panel?.querySelectorAll('.attach-item');
  // We'll find the data from Firestore snapshot cache — easier to re-read from DOM
  const imgEl=items?.[idx]?.querySelector('img');
  if(imgEl){openLightbox(imgEl.src);return;}
  // For non-images, download via anchor
  const attachItemEl=items?.[idx];
  if(attachItemEl){
    // Try to get data from the rendered element — we need to store it
    // Actually just show toast - user can use the delete button  
    showToast('לחץ לחיצה ימנית להורדה');
  }
};

// Delete attachment
window.delAttachment=async function(taskId,idx){
  if(!currentUser)return;
  const {getDoc}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const taskDoc=await getDoc(doc(db,'tasks',taskId));
  if(!taskDoc.exists())return;
  const att=[...(taskDoc.data().attachments||[])];
  att.splice(idx,1);
  await updateDoc(doc(db,'tasks',taskId),{attachments:att});
  showToast('קובץ הוסר');
};

// Lightbox
window.openLightbox=function(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open');};
window.closeLightbox=function(){document.getElementById('lightbox').classList.remove('open');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

})();
</script>
</body>
</html>
