<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TaskManager Enterprise</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Heebo',sans-serif;background:#f0f2f5;min-height:100vh;direction:rtl}nav{background:linear-gradient(135deg,#4F46E5,#7C3AED);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(79,70,229,.3);position:sticky;top:0;z-index:100}nav h1{color:#fff;font-size:1.3rem;font-weight:700}#navUser{display:flex;align-items:center;gap:.75rem}#navUser img{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}#navUser span{color:#fff;font-size:.9rem}#btnSignOut{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);padding:.4rem 1rem;border-radius:20px;cursor:pointer;font-family:inherit;font-size:.85rem}#screenAuth{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 70px)}.auth-card{background:#fff;border-radius:20px;padding:3rem 2.5rem;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.1);max-width:400px;width:90%}.auth-icon{font-size:4rem;margin-bottom:1rem}.auth-card h2{font-size:1.8rem;font-weight:800;color:#1a1a2e;margin-bottom:.5rem}.auth-card p{color:#6b7280;margin-bottom:2rem}#btnSignIn{display:flex;align-items:center;justify-content:center;gap:.75rem;background:#fff;border:2px solid #e5e7eb;color:#374151;padding:1rem 2rem;border-radius:12px;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;width:100%;transition:all .2s}#btnSignIn:hover{background:#f9fafb;border-color:#4F46E5}#screenApp{padding:2rem;max-width:900px;margin:0 auto;display:none}.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}.stat-card{background:#fff;border-radius:12px;padding:1.25rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}.stat-card .num{font-size:2rem;font-weight:800;color:#4F46E5}.stat-card .label{font-size:.8rem;color:#6b7280;margin-top:.25rem}.add-task-box{background:#fff;border-radius:12px;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:2rem;display:flex;gap:1rem}#taskInput{flex:1;border:2px solid #e5e7eb;border-radius:10px;padding:.75rem 1rem;font-family:inherit;font-size:1rem;outline:none}#taskInput:focus{border-color:#4F46E5}#btnAdd{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;border:none;border-radius:10px;padding:.75rem 1.5rem;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer}.tasks-header{font-size:1.1rem;font-weight:700;color:#374151;margin-bottom:1rem}#taskList{display:flex;flex-direction:column;gap:.75rem}.task-item{background:#fff;border-radius:12px;padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;box-shadow:0 2px 8px rgba(0,0,0,.06);animation:fadeUp .2s ease}.task-item.done .task-text{text-decoration:line-through;color:#9ca3af}.task-check{width:22px;height:22px;border-radius:50%;border:2px solid #d1d5db;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}.task-check.checked{background:#4F46E5;border-color:#4F46E5;color:#fff}.task-text{flex:1;font-size:.95rem;color:#374151}.task-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:1.1rem;opacity:.6}.task-del:hover{opacity:1}.empty-state{text-align:center;padding:4rem 2rem;color:#9ca3af}.empty-state .icon{font-size:4rem;margin-bottom:1rem}#toast{position:fixed;bottom:2rem;right:50%;transform:translateX(50%);background:#1a1a2e;color:#fff;padding:.75rem 1.5rem;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}#toast.show{opacity:1}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<nav><h1>📋 TaskManager Enterprise</h1>
<div id="navUser" style="display:none"><img id="navAvatar" src="" alt=""><span id="navName"></span><button id="btnSignOut">✕ התנתק</button></div>
</nav>
<div id="screenAuth"><div class="auth-card">
<div class="auth-icon">👋</div><h2>ברוך הבא!</h2><p>היכנס עם חשבון Google שלך כדי להתחיל</p>
<button id="btnSignIn"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> כניסה עם Google</button>
</div></div>
<div id="screenApp">
<div class="stats-bar"><div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">סה"כ משימות</div></div><div class="stat-card"><div class="num" id="statDone">0</div><div class="label">הושלמו</div></div><div class="stat-card"><div class="num" id="statPending">0</div><div class="label">ממתינות</div></div></div>
<div class="add-task-box"><input id="taskInput" placeholder="הוסף משימה חדשה..."><button id="btnAdd">+ הוסף</button></div>
<div class="tasks-header">המשימות שלי</div><div id="taskList"></div>
</div>
<div id="toast"></div>
<script>(async()=>{
const{initializeApp}=await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
const{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
const{getFirestore,collection,addDoc,deleteDoc,doc,updateDoc,onSnapshot,query,where,orderBy}=await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
const cfg={apiKey:'AIzaSyBSsizUt53bkQD_Osc3oeSvvW-EJG96ZEo',authDomain:'taskmanager-enterprise.firebaseapp.com',projectId:'taskmanager-enterprise',storageBucket:'taskmanager-enterprise.firebasestorage.app',messagingSenderId:'355996684261',appId:'1:355996684261:web:0286eaa61473af6b90290c'};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);let unsub=null;
const $=id=>document.getElementById(id);
const toast=msg=>{const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)};
const stats=tasks=>{const d=tasks.filter(t=>t.done).length;$('statTotal').textContent=tasks.length;$('statDone').textContent=d;$('statPending').textContent=tasks.length-d};
const render=tasks=>{const L=$('taskList');stats(tasks);if(!tasks.length){L.innerHTML='<div class="empty-state"><div class="icon">\u{1F4ED}</div><p>\u{5D0}\u{5D9}\u{5DF} \u{5DE}\u{5E9}\u{5D9}\u{5DE}\u{5D5}\u{5EA} \u{5E2}\u{5D3}\u{5D9}\u{5D9}\u{5DF}</p></div>';return}L.innerHTML=tasks.map(t=>'<div class="task-item '+(t.done?'done':'')+'" ><div class="task-check '+(t.done?'checked':'')+'" data-id="'+t.id+'" data-done="'+(!t.done)+'">'+(t.done?'\u{2713}':'')+'</div><span class="task-text">'+t.text+'</span><button class="task-del" data-id="'+t.id+'">\u{1F5D1}</button></div>').join('');L.querySelectorAll('.task-check').forEach(e=>e.onclick=()=>updateDoc(doc(db,'tasks',e.dataset.id),{done:e.dataset.done==='true'}).then(()=>toast(e.dataset.done==='true'?'\u{5D4}\u{5D5}\u{5E9}\u{5DC}\u{5DE}\u{5D4}!':'\u{5E4}\u{5EA}\u{5D5}\u{5D7}\u{5D4}')));L.querySelectorAll('.task-del').forEach(e=>e.onclick=()=>deleteDoc(doc(db,'tasks',e.dataset.id)).then(()=>toast('\u{5E0}\u{5DE}\u{5D7}\u{5E7}\u{5D4}')))};
onAuthStateChanged(auth,u=>{if(u){$('screenAuth').style.display='none';$('screenApp').style.display='block';$('navUser').style.display='flex';$('navAvatar').src=u.photoURL||'';$('navName').textContent=u.displayName||u.email;if(unsub)unsub();unsub=onSnapshot(query(collection(db,'tasks'),where('uid','==',u.uid),orderBy('createdAt','desc')),s=>render(s.docs.map(d=>({id:d.id,...d.data()}))));toast('\u{5E9}\u{5DC}\u{5D5}\u{5DD} '+u.displayName+'!')}else{$('screenAuth').style.display='flex';$('screenApp').style.display='none';$('navUser').style.display='none';if(unsub){unsub();unsub=null}}});
$('btnSignIn').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast('\u{5E9}\u{5D2}\u{5D9}\u{5D0}\u{5D4}: '+e.message));
$('btnSignOut').onclick=()=>signOut(auth).then(()=>toast('\u{5D4}\u{5EA}\u{5E0}\u{5EA}\u{5E7}\u{5EA}'));
$('btnAdd').onclick=async()=>{const i=$('taskInput'),t=i.value.trim(),u=auth.currentUser;if(!t||!u)return;await addDoc(collection(db,'tasks'),{text:t,done:false,uid:u.uid,createdAt:Date.now()});i.value='';toast('\u{5E0}\u{5D5}\u{5E1}\u{5E3}!')};
$('taskInput').onkeydown=e=>{if(e.key==='Enter')$('btnAdd').click()};
})();</script>
</body></html>
